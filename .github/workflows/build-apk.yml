name: Build Screenshot Memory APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate latest AI Studio ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir android-project

          unzip -o "$ZIP_FILE" -d android-project

          echo "=== EXTRACTED FILES ==="
          find android-project -maxdepth 5 -type f | head -200

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -keystore "$PROJECT_ROOT/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created at:"
          ls -l "$PROJECT_ROOT/debug.keystore"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_ROOT/gradlew" 2>/dev/null || true

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "=== SEARCHING FOR APK ==="

          find "$PROJECT_ROOT" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_ROOT" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Memory-Final-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error          
