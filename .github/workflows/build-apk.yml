name: Build Screenshot Memory APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q screenshot-memory.zip -d android-project
          echo "Extracted files:"
          find android-project -maxdepth 2 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Memory-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
